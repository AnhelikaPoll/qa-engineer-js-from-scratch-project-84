  expected-result: |
    Поле поиска и фильтры расположены в верхней части страницы, хорошо заметны и доступны для взаимодействия без прокрутки.

- summary: |
    Удобство использования — понятные подписи к элементам
  requirement: |
    Сайт должен быть разработан с учетом удобства использования.
  prerequisites: |
    Открыта страница товара.
  steps:
    - Проверить наличие подписей у кнопок и полей ввода
  expected-result: |
    Кнопки «Добавить в корзину», «Найти», поля поиска и фильтры имеют понятные текстовые подписи, соответствующие их функциям.

- summary: |
    Скорость работы — время загрузки главной страницы
  requirement: |
    Сайт должен быть оптимизирован для скорости работы.
  prerequisites: |
    Открыта главная страница магазина.
  steps:
    - Измерить время полной загрузки страницы с помощью инструментов разработчика
  expected-result: |
    Время загрузки страницы не превышает 3 секунд (при нормальном интернет-соединении).

- summary: |
    Скорость работы — время ответа при поиске и фильтрации
  requirement: |
    Сайт должен быть оптимизирован для скорости работы.
  prerequisites: |
    Открыта главная страница магазина.
  test-data:
    search_query: "Mascara"
  steps:
    - Ввести "Mascara" в поле поиска и нажать «Найти»
    - Измерить время отклика (время получения результатов)
  expected-result: |
    Результаты поиска отображаются не позднее чем через 2 секунды после нажатия кнопки.

- summary: |
    Безопасность — использование HTTPS
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя.
  prerequisites: |
    Открыта страница магазина.
  steps:
    - Проверить протокол в адресной строке браузера
  expected-result: |
    Сайт использует защищенное соединение HTTPS. В адресной строке отображается значок замка.

- summary: |
    Безопасность — корректная конфигурация TLS и защита данных при передаче
  requirement: |
    Сайт должен обеспечивать защиту данных пользователя при передаче по сети с использованием TLS.
  prerequisites: |
    Открыта страница магазина (например, главная или страница товара).
  steps:
    - Проверить, что все страницы и ресурсы загружаются по протоколу HTTPS (в адресной строке отображается замок).
    - Открыть инструменты разработчика (вкладка Network) и проверить, что все запросы используют протокол HTTPS, отсутствуют запросы по HTTP (mixed content).
    - Проверить, что чувствительные данные (пароли, токены, персональные данные) не передаются в параметрах URL.
    - Проверить наличие и корректность заголовка HSTS (Strict-Transport-Security) в ответе сервера.
    - Проверить, что сессионные cookies имеют флаг Secure.
    - С помощью онлайн-инструментов (например, SSL Labs SSL Test) проверить конфигурацию TLS сервера: поддержка TLS 1.3/1.2, отключение устаревших протоколов и слабых шифров.
  expected-result: |
    Все страницы и ресурсы загружаются по HTTPS. Mixed content отсутствует. Чувствительные данные не передаются в URL. Заголовок HSTS присутствует и настроен корректно. Сессионные cookies имеют флаг Secure. Конфигурация TLS соответствует современным стандартам безопасности (поддержка TLS 1.3 или 1.2, устаревшие протоколы и слабые шифры отключены).

