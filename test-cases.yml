# ============================================
# ФУНКЦИОНАЛЬНЫЕ ТРЕБОВАНИЯ (functional)
# ============================================
---
- summary: |
    Успешный поиск товаров по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории.
  prerequisites: |
    Открыта главная страница магазина.
  test-data:
    search_query: "Mascara"
  steps:
    - Ввести в поле поиска ключевое слово "Mascara"
    - Нажать кнопку «Найти»
  expected-result: |
    В результатах поиска отображаются только товары, содержащие в названии или описании слово "Mascara". Например, товар "Essence Mascara Lash Princess".

- summary: |
    Поиск товаров по несуществующему ключевому слову
  requirement: |
    Сайт должен корректно обрабатывать пустые результаты поиска и фильтрации, отображая соответствующее сообщение.
  prerequisites: |
    Открыта главная страница магазина.
  test-data:
    search_query: "NonExistentProduct123"
  steps:
    - Ввести в поле поиска ключевое слово "NonExistentProduct123"
    - Нажать кнопку «Найти»
  expected-result: |
    Отображается сообщение "Ничего не найдено".

- summary: |
    Успешная фильтрация товаров по категории "Beauty"
  requirement: |
    Пользователь должен иметь возможность фильтровать товары.
  prerequisites: |
    Открыта главная страница магазина.
  test-data:
    category: "Beauty"
  steps:
    - Выбрать категорию "Beauty" в фильтре
    - Применить фильтр
  expected-result: |
    В списке товаров отображаются только товары, относящиеся к категории "Beauty".

- summary: |
    Просмотр подробной информации о товаре
  requirement: |
    Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре.
  prerequisites: |
    На главной странице отображается список товаров.
  test-data:
    product_name: "Essence Mascara Lash Princess"
  steps:
    - Нажать на карточку товара "Essence Mascara Lash Princess"
  expected-result: |
    Открывается страница с подробной информацией о товаре, включающая название, описание, цену, рейтинг и другую информацию.

- summary: |
    Добавление товара в корзину со страницы товара
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины.
  prerequisites: |
    Открыта страница с подробной информацией о товаре "Essence Mascara Lash Princess".
  test-data:
    product_name: "Essence Mascara Lash Princess"
    quantity: 1
  steps:
    - Нажать кнопку «Добавить в корзину»
  expected-result: |
    Товар успешно добавлен в корзину. Появляется уведомление "Товар добавлен в корзину". Счетчик корзины увеличивается на 1.

- summary: |
    Добавление нескольких товаров в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины.
  prerequisites: |
    Открыта главная страница магазина.
  test-data:
    product_1: "Essence Mascara Lash Princess"
    product_2: "Red Lipstick"
  steps:
    - Нажать на карточку товара "Essence Mascara Lash Princess"
    - Нажать кнопку «Добавить в корзину»
    - Вернуться на главную страницу
    - Нажать на карточку товара "Red Lipstick"
    - Нажать кнопку «Добавить в корзину»
  expected-result: |
    Оба товара добавлены в корзину. Счетчик корзины показывает количество добавленных товаров (2).

- summary: |
    Просмотр содержимого корзины с товарами
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины.
  prerequisites: |
    В корзине есть как минимум один товар.
  steps:
    - Нажать на иконку корзины в верхней части страницы
  expected-result: |
    Открывается страница корзины, на которой отображается список добавленных товаров с их названиями, ценами и количеством.

- summary: |
    Просмотр пустой корзины
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины.
  prerequisites: |
    Корзина пуста.
  steps:
    - Нажать на иконку корзины в верхней части страницы
  expected-result: |
    Открывается страница корзины с сообщением "Корзина пуста".

- summary: |
    Удаление товара из корзины
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины.
  prerequisites: |
    В корзине есть хотя бы один товар.
  test-data:
    product_name: "Essence Mascara Lash Princess"
  steps:
    - Нажать на иконку корзины
    - Нажать кнопку «Удалить» рядом с товаром "Essence Mascara Lash Princess"
  expected-result: |
    Товар удален из корзины. Счетчик корзины уменьшается. Если товаров не осталось, отображается сообщение о пустой корзине.

- summary: |
    Переключение языка интерфейса на английский
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса. Сайт должен иметь локализацию (перевод) на русский и английский языки.
  prerequisites: |
    Открыта главная страница магазина. Текущий язык интерфейса — русский.
  test-data:
    language: "English"
  steps:
    - Нажать на переключатель языка и выбрать "English"
  expected-result: |
    Интерфейс сайта полностью переключается на английский язык. Все надписи, меню, кнопки и сообщения отображаются на английском.

- summary: |
    Переключение языка интерфейса на русский
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса. Сайт должен иметь локализацию (перевод) на русский и английский языки.
  prerequisites: |
    Открыта главная страница магазина. Текущий язык интерфейса — английский.
  test-data:
    language: "Русский"
  steps:
    - Нажать на переключатель языка и выбрать "Русский"
  expected-result: |
    Интерфейс сайта полностью переключается на русский язык. Все надписи, меню, кнопки и сообщения отображаются на русском.


# ============================================
# НЕФУНКЦИОНАЛЬНЫЕ ТРЕБОВАНИЯ (non-functional)
# ============================================

- summary: |
