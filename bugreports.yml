---
- summary: |
    Медленная загрузка главной страницы (LCP > 15 секунд)
  environment: |
    Google Chrome (последняя стабильная версия)
    ОС: любая (Windows, Linux, macOS)
    URL: https://products-store.hexlet.app
  steps-to-reproduce:
    - Открыть сайт https://products-store.hexlet.app в браузере.
    - Открыть DevTools (F12) и перейти на вкладку "Lighthouse" (или "Performance").
    - Запустить анализ производительности (генерацию отчёта).
    - Зафиксировать значение метрики Largest Contentful Paint (LCP).
  expected-result: |
    LCP должен быть не более 3 секунд (согласно требованию к скорости загрузки).
  actual-result: |
    LCP составляет 15.69 секунд. Самый крупный элемент – `h6.me-3`. Метрика оценивается как "poor".

- summary: |
    Нестабильная вёрстка – высокий Cumulative Layout Shift (CLS)
  environment: |
    Google Chrome (последняя стабильная версия)
    ОС: любая
    URL: https://products-store.hexlet.app
  steps-to-reproduce:
    - Открыть сайт https://products-store.hexlet.app в браузере.
    - Открыть DevTools, перейти на вкладку "Lighthouse" или "Performance".
    - Запустить анализ производительности.
    - Зафиксировать значение метрики Cumulative Layout Shift (CLS).
  expected-result: |
    CLS должен быть не более 0.1 (хороший показатель).
  actual-result: |
    CLS составляет 0.56, что классифицируется как "poor". Зафиксирован один значительный сдвиг (worst cluster: 1 shift), что ухудшает пользовательский опыт.

- summary: |
    Ошибка 500 при запросе к /orders
  environment: |
    ОС: Windows 11
    Браузер: Google Chrome (последняя стабильная версия)
    URL: https://products-store.hexlet.app
  steps-to-reproduce:
    - Открыть сайт https://products-store.hexlet.app.
    - Добавить любой товар в корзину (например, "Essence Mascara Lash Princess").
    - Открыть корзину, нажав на иконку корзины в правом верхнем углу.
    - Открыть DevTools (F12) и перейти на вкладку Network.
    - Нажать кнопку «Оформить заказ».
    - Найти в списке запросов запрос с именем "orders".
  expected-result: |
    Запрос к /orders должен завершаться успешно (статус 200) и возвращать корректные данные (например, список заказов или пустой массив, если заказов нет).
  actual-result: |
    Запрос к /orders возвращает статус 500 (Internal Server Error). В столбце Status отображается "500", размер ответа – 0.1 kB, что указывает на внутреннюю ошибку сервера.

- summary: |
    Переключение языка интерфейса на русский
  environment: |
    Браузер: Chrome 120
    ОС: Windows 11
  steps-to-reproduce:
    - Открыть сайт https://products-store.hexlet.app.
    - Нажать на переключатель языка и выбрать "Русский"
  expected-result: |
    Интерфейс сайта полностью переключается на русский язык. Все надписи, меню, кнопки и сообщения отображаются на русском.
  actual-result: |
    Описание товаров, названия категорий не переключается на русский язык.

- summary: |
    Состояние корзины не сохраняется после закрытия и повторного открытия браузера
  environment: |
    Google Chrome (последняя стабильная версия)
    ОС: любая
    URL: https://products-store.hexlet.app
  steps-to-reproduce:
    - Открыть сайт https://products-store.hexlet.app.
    - Добавить любой товар в корзину (например, "Essence Mascara Lash Princess").
    - Закрыть браузер полностью.
    - Снова открыть браузер и перейти на сайт.
    - Открыть корзину (нажать на иконку корзины).
  expected-result: |
    Добавленный ранее товар должен оставаться в корзине. Состояние корзины сохраняется между сессиями (согласно неявному требованию).
  actual-result: |
    Корзина пуста. Товар, добавленный до закрытия браузера, отсутствует.

- summary: |
    Поле поиска обрезается на мобильных устройствах (эмуляция iPhone 12/Pixel 5)
  environment: |
    ОС: Windows 11
    Браузер: Google Chrome (последняя стабильная версия)
    Режим эмуляции: iPhone 12 / Pixel 5 (DevTools → Toggle device toolbar)
    URL: https://products-store.hexlet.app
  steps-to-reproduce:
    - Открыть сайт в режиме эмуляции мобильного устройства (выбрать iPhone 12 или Pixel 5).
    - Дождаться полной загрузки главной страницы.
    - Обратить внимание на поле поиска в верхней части страницы.
  expected-result: |
    Поле поиска должно отображаться полностью, без обрезания, текст внутри поля должен быть полностью виден.
  actual-result: |
    Поле поиска обрезано по правому краю, часть текста или иконки не видны.

- summary: |
    Текст кнопки «Оформить заказ» выходит за границы кнопки на мобильных устройствах
  environment: |
    ОС: Windows 11
    Браузер: Google Chrome (последняя стабильная версия)
    Режим эмуляции: iPhone 12 / Pixel 5 (DevTools → Toggle device toolbar)
    URL: https://products-store.hexlet.app
  steps-to-reproduce:
    - Открыть сайт в режиме эмуляции мобильного устройства (выбрать iPhone 12 или Pixel 5).
    - Добавить любой товар в корзину (например, "Essence Mascara Lash Princess").
    - Открыть корзину, нажав на иконку корзины.
    - Обратить внимание на кнопку «Оформить заказ» в нижней части страницы корзины.
  expected-result: |
    Текст кнопки «Оформить заказ» должен полностью помещаться внутри кнопки, не выходя за её границы.
  actual-result: |
    Надпись «Оформить заказ» выходит за правую и нижнюю границы кнопки, часть текста обрезается или наезжает на край.
    
- summary: |
    Проблемы с отображением на десктопе при разных разрешениях экрана
  environment: |
    Google Chrome (последняя стабильная версия)
    ОС: Windows 10 / macOS
    URL: https://products-store.hexlet.app
  steps-to-reproduce:
    - Открыть сайт на десктопе с разрешением 1920x1080.
    - Изменить размер окна браузера до 1366x768 или 1280x720.
    - Обратить внимание на расположение карточек товаров и фильтров.
  expected-result: |
    При изменении размера окна элементы должны плавно подстраиваться, сетка товаров должна оставаться читаемой, фильтры и поиск не должны съезжать или перекрываться.
  actual-result: |
    Картинка не адаптируется под ширину экрана. Размеры кнопок маленькие. Этот эффект усугубляется высоким CLS (0.56).
