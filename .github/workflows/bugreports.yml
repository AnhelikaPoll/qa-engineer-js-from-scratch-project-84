---
- summary: |
    Медленная загрузка главной страницы (LCP > 15 секунд)
  environment: |
    Google Chrome (последняя стабильная версия)
    ОС: любая (Windows, Linux, macOS)
    URL: https://products-store.hexlet.app
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app в браузере.
    2. Открыть DevTools (F12) и перейти на вкладку "Lighthouse" (или "Performance").
    3. Запустить анализ производительности (генерацию отчёта).
    4. Зафиксировать значение метрики Largest Contentful Paint (LCP).
  expected-result: |
    LCP должен быть не более 3 секунд (согласно требованию к скорости загрузки).
  actual-result: |
    LCP составляет 15.69 секунд. Самый крупный элемент – `h6.me-3`. Метрика оценивается как "poor".

- summary: |
    Нестабильная вёрстка – высокий Cumulative Layout Shift (CLS)
  environment: |
    Google Chrome (последняя стабильная версия)
    ОС: любая
    URL: https://products-store.hexlet.app
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app в браузере.
    2. Открыть DevTools, перейти на вкладку "Lighthouse" или "Performance".
    3. Запустить анализ производительности.
    4. Зафиксировать значение метрики Cumulative Layout Shift (CLS).
  expected-result: |
    CLS должен быть не более 0.1 (хороший показатель).
  actual-result: |
    CLS составляет 0.56, что классифицируется как "poor". Зафиксирован один значительный сдвиг (worst cluster: 1 shift), что ухудшает пользовательский опыт.

- summary: |
    Ошибка 500 при запросе к /orders
  environment: |
    Google Chrome (последняя стабильная версия)
    ОС: любая
    URL: https://products-store.hexlet.app
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app.
    2. Открыть DevTools (F12) и перейти на вкладку Network.
    3. Обновить страницу или дождаться её полной загрузки.
    4. Найти в списке запросов запрос с именем "orders".
  expected-result: |
    Запрос к /orders должен завершаться успешно (статус 200) и возвращать корректные данные (например, список заказов или пустой массив, если заказов нет).
  actual-result: |
    Запрос к /orders возвращает статус 500 (Internal Server Error). В столбце Status отображается "500", размер ответа – 0.1 kB, что указывает на внутреннюю ошибку сервера.

- summary: |
  Переключение языка интерфейса на русский
  environment: |
    Google Chrome (последняя стабильная версия)
    ОС: любая
    URL: https://products-store.hexlet.app
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app.
    2. Нажать на переключатель языка и выбрать "Русский"
  expected-result: |
    Интерфейс сайта полностью переключается на русский язык. Все надписи, меню, кнопки и сообщения отображаются на русском.
  actual-result: |
    Описание товаров, названия категорий не переключается на русский язык.
    
- summary: |
    Состояние корзины не сохраняется после закрытия и повторного открытия браузера
  environment: |
    Google Chrome (последняя стабильная версия)
    ОС: любая
    URL: https://products-store.hexlet.app
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app.
    2. Добавить любой товар в корзину (например, "Essence Mascara Lash Princess").
    3. Закрыть браузер полностью.
    4. Снова открыть браузер и перейти на сайт.
    5. Открыть корзину (нажать на иконку корзины).
  expected-result: |
    Добавленный ранее товар должен оставаться в корзине. Состояние корзины сохраняется между сессиями (согласно неявному требованию).
  actual-result: |
    Корзина пуста. Товар, добавленный до закрытия браузера, отсутствует.
