  steps: |
    - Найти товар с помощью поиска
    - Добавить товар в корзину
    - Открыть корзину
  expected-result: |
    Все функции (поиск, добавление в корзину, просмотр корзины) работают корректно на мобильном устройстве. Интерфейс адаптирован под тач-взаимодействие.

