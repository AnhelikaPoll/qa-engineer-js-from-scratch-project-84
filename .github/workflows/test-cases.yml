  expected-result: |
    Сайт доступен по прямой ссылке без использования VPN из всех проверяемых регионов. Отсутствуют географические ограничения.


# ============================================
# НЕЯВНЫЕ ТРЕБОВАНИЯ (implicit)
# ============================================

- summary: |
    Сохранение состояния корзины после перезагрузки страницы
  requirement: |
    Сайт должен сохранять состояние корзины между сессиями пользователя.
  prerequisites: |
    В корзину добавлен хотя бы один товар.
  steps: |
    - Перезагрузить текущую страницу
  expected-result: |
    После перезагрузки страницы содержимое корзины сохраняется. Количество товаров в корзине не изменилось.

- summary: |
    Сохранение состояния корзины после закрытия и повторного открытия браузера
  requirement: |
    Сайт должен сохранять состояние корзины между сессиями пользователя.
  prerequisites: |
    В корзину добавлен хотя бы один товар.
  steps: |
    - Закрыть браузер
    - Открыть браузер и зайти на сайт
  expected-result: |
    После перезапуска браузера содержимое корзины сохраняется. Количество товаров в корзине не изменилось.

- summary: |
    Обратная связь при добавлении товара в корзину
  requirement: |
    Сайт должен предоставлять пользователю понятную обратную связь при выполнении действий (например, подтверждение добавления в корзину).
  prerequisites: |
    Открыта страница с подробной информацией о товаре.
  test-data: |
    Товар: "Red Lipstick"
  steps: |
    - Нажать кнопку «Добавить в корзину»
  expected-result: |
    Сразу после нажатия появляется заметное визуальное подтверждение (всплывающее сообщение, изменение цвета кнопки или анимация), информирующее об успешном добавлении товара.

- summary: |
    Обратная связь при удалении товара из корзины
  requirement: |
