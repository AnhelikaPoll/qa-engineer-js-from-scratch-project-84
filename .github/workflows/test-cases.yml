# ============================================
# ФУНКЦИОНАЛЬНЫЕ ТРЕБОВАНИЯ (functional)
# ============================================
---
- summary: |
    Успешный поиск товаров по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории.
  prerequisites: |
    Открыта главная страница магазина.
  test-data: |
    Ключевое слово для поиска: "Mascara"
  steps:
    - Ввести в поле поиска ключевое слово "Mascara"
    - Нажать кнопку «Найти» или клавишу Enter
  expected-result: |
    В результатах поиска отображаются только товары, содержащие в названии или описании слово "Mascara". Например, товар "Essence Mascara Lash Princess".

- summary: |
    Поиск товаров по несуществующему ключевому слову
  requirement: |
    Сайт должен корректно обрабатывать пустые результаты поиска и фильтрации, отображая соответствующее сообщение.
  prerequisites: |
    Открыта главная страница магазина.
  test-data: |
    Ключевое слово для поиска: "NonExistentProduct123"
  steps:
    - Ввести в поле поиска ключевое слово "NonExistentProduct123"
    - Нажать кнопку «Найти» или клавишу Enter
  expected-result: |
    Отображается сообщение о том, что товары не найдены (например, "Ничего не найдено" или аналогичное).

- summary: |
    Успешная фильтрация товаров по категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары.
  prerequisites: |
    Открыта главная страница магазина.
  test-data: |
    Категория для фильтрации: "Makeup" (или другая доступная категория)
  steps:
    - Выбрать категорию "Makeup" в фильтре
    - Применить фильтр
  expected-result: |
    В списке товаров отображаются только товары, относящиеся к выбранной категории.

- summary: |
    Фильтрация товаров по категории, не дающей результатов
  requirement: |
    Сайт должен корректно обрабатывать пустые результаты поиска и фильтрации, отображая соответствующее сообщение.
  prerequisites: |
    Открыта главная страница магазина.
  test-data: |
    Категория фильтра: "Fragrances" (если товаров в этой категории нет или она не существует)
  steps:
    - Выбрать категорию, под которую нет товаров
    - Применить фильтр
  expected-result: |
    Отображается сообщение о том, что товары не найдены.

- summary: |
    Просмотр подробной информации о товаре
  requirement: |
    Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре.
  prerequisites: |
    На главной странице отображается список товаров.
  test-data: |
    Товар: "Essence Mascara Lash Princess"
  steps:
    - Нажать на карточку товара "Essence Mascara Lash Princess"
  expected-result: |
    Открывается страница с подробной информацией о товаре, включающая название, описание, цену, рейтинг и другую информацию.

- summary: |
    Добавление товара в корзину со страницы товара
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины.
  prerequisites: |
    Открыта страница с подробной информацией о товаре (например, "Essence Mascara Lash Princess").
  test-data: |
    Товар: "Essence Mascara Lash Princess", количество: 1
  steps:
    - Нажать кнопку «Добавить в корзину»
  expected-result: |
    Товар успешно добавлен в корзину. Появляется уведомление (например, "Товар добавлен в корзину"). Счетчик корзины увеличивается на 1.

- summary: |
    Добавление нескольких товаров в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины.
  prerequisites: |
    Открыта главная страница магазина.
  test-data: |
    Товары: "Essence Mascara Lash Princess", "Red Lipstick"
  steps:
    - Нажать на карточку первого товара
    - Нажать кнопку «Добавить в корзину»
    - Вернуться на главную страницу
    - Нажать на карточку второго товара
    - Нажать кнопку «Добавить в корзину»
  expected-result: |
    Оба товара добавлены в корзину. Счетчик корзины показывает количество добавленных товаров (2).

- summary: |
    Просмотр содержимого корзины с товарами
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины.
  prerequisites: |
    В корзине уже есть как минимум один товар.
  steps:
    - Нажать на иконку корзины в верхней части страницы
  expected-result: |
    Открывается страница корзины, на которой отображается список добавленных товаров с их названиями, ценами и количеством.

- summary: |
    Просмотр пустой корзины
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины.
  prerequisites: |
    Корзина пуста.
  steps:
    - Нажать на иконку корзины в верхней части страницы
  expected-result: |
    Открывается страница корзины с сообщением о том, что корзина пуста (например, "Корзина пуста").

- summary: |
    Удаление товара из корзины
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины.
  prerequisites: |
    В корзине есть хотя бы один товар.
  test-data: |
    Товар: "Essence Mascara Lash Princess"
  steps:
    - Нажать на иконку корзины
    - Нажать кнопку «Удалить» или «✕» рядом с товаром
  expected-result: |
    Товар удален из корзины. Счетчик корзины уменьшается. Если товаров не осталось, отображается сообщение о пустой корзине.

- summary: |
    Переключение языка интерфейса на английский
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса. Сайт должен иметь локализацию (перевод) на русский и английский языки.
  prerequisites: |
    Открыта главная страница магазина. Текущий язык интерфейса — русский.
  test-data: |
    Язык: English
  steps:
    - Нажать на переключатель языка и выбрать "English"
  expected-result: |
    Интерфейс сайта полностью переключается на английский язык. Все надписи, меню, кнопки и сообщения отображаются на английском.

- summary: |
    Переключение языка интерфейса на русский
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса. Сайт должен иметь локализацию (перевод) на русский и английский языки.
  prerequisites: |
    Открыта главная страница магазина. Текущий язык интерфейса — английский.
  test-data: |
    Язык: Русский
  steps:
    - Нажать на переключатель языка и выбрать "Русский"
  expected-result: |
    Интерфейс сайта полностью переключается на русский язык. Все надписи, меню, кнопки и сообщения отображаются на русском.


# ============================================
# НЕФУНКЦИОНАЛЬНЫЕ ТРЕБОВАНИЯ (non-functional)
# ============================================

- summary: |
    Удобство использования — наличие поиска и фильтрации на видном месте
  requirement: |
    Сайт должен быть разработан с учетом удобства использования.
  prerequisites: |
    Открыта главная страница магазина.
  steps:
    - Визуально оценить расположение элементов управления (поиск, фильтры, корзина)
  expected-result: |
    Поле поиска и фильтры расположены в верхней части страницы, хорошо заметны и доступны для взаимодействия без прокрутки.

- summary: |
    Удобство использования — понятные подписи к элементам
  requirement: |
    Сайт должен быть разработан с учетом удобства использования.
  prerequisites: |
    Открыта страница товара.
  steps:
    - Проверить наличие подписей у кнопок и полей ввода
  expected-result: |
    Кнопки «Добавить в корзину», «Найти», поля поиска и фильтры имеют понятные текстовые подписи, соответствующие их функциям.

- summary: |
    Скорость работы — время загрузки главной страницы
  requirement: |
    Сайт должен быть оптимизирован для скорости работы.
  prerequisites: |
    Открыта главная страница магазина.
  steps:
    - Измерить время полной загрузки страницы с помощью инструментов разработчика
  expected-result: |
    Время загрузки страницы не превышает 3 секунд (при нормальном интернет-соединении).

- summary: |
    Скорость работы — время ответа при поиске и фильтрации
  requirement: |
    Сайт должен быть оптимизирован для скорости работы.
  prerequisites: |
    Открыта главная страница магазина.
  test-data: |
    Поисковый запрос: "Mascara"
  steps:
    - Ввести "Mascara" в поле поиска и нажать «Найти»
    - Измерить время отклика (время получения результатов)
  expected-result: |
    Результаты поиска отображаются не позднее чем через 2 секунды после нажатия кнопки.

- summary: |
    Безопасность — использование HTTPS
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя.
  prerequisites: |
    Открыта страница магазина.
  steps:
    - Проверить протокол в адресной строке браузера
  expected-result: |
    Сайт использует защищенное соединение HTTPS. В адресной строке отображается значок замка.

- summary: |
    Безопасность — отсутствие передачи конфиденциальных данных в открытом виде
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя.
  prerequisites: |
    Открыта страница с формой (например, оформление заказа или корзина).
  steps:
    - Открыть инструменты разработчика (вкладка Network)
    - Отправить данные формы
    - Проверить, что данные передаются по защищенному соединению (HTTPS) и не видны в открытом виде
  expected-result: |
    Все данные передаются по протоколу HTTPS. В запросах отсутствуют чувствительные данные в открытом тексте (только в зашифрованном виде).

- summary: |
    Наличие мобильной версии — корректное отображение на мобильном устройстве
  requirement: |
    Сайт должен иметь мобильную версию.
  prerequisites: |
    Открыт сайт на мобильном устройстве (или в режиме эмуляции мобильного устройства в браузере).
  steps: |
    - Открыть сайт на экране шириной 375px (iPhone SE) или 414px (iPhone 12 Pro)
  expected-result: |
    Сайт корректно отображается на экране мобильного устройства. Все элементы видны, текст читаем, кнопки имеют достаточный размер для нажатия пальцем. Верстка адаптивная (элементы не выходят за пределы экрана).

- summary: |
    Наличие мобильной версии — работа функционала на мобильном устройстве
  requirement: |
    Сайт должен иметь мобильную версию.
  prerequisites: |
