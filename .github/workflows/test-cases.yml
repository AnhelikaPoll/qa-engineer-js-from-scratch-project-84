- summary: |
    Обработка большого трафика — стабильность работы при нагрузке
  requirement: |
    Сайт должен быть способен обрабатывать большое количество трафика.
  prerequisites: |
    Настроено нагрузочное тестирование (например, с помощью JMeter или другого инструмента).
  test-data: |
    Нагрузка: 1000 одновременных пользователей
  steps: |
    - Запустить нагрузочный тест с параметром 1000 одновременных пользователей
    - Зафиксировать количество успешных ответов и время отклика
  expected-result: |
    Сайт выдерживает нагрузку в 1000 одновременных пользователей без критического снижения производительности (время отклика не превышает допустимые значения, ошибки не превышают 1%).

